<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111936"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#CBD5E1" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="130" r="300" fill="#F97316" fill-opacity="0.13"/>
  <circle cx="180" cy="820" r="320" fill="#3B82F6" fill-opacity="0.13"/>

  <!-- Left: title block -->
  <rect x="110" y="250" width="84" height="84" rx="20" fill="url(#orange)"/>
  <path d="M132 280l20-10 20 10v24l-20 10-20-10z" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <path d="M132 280l20 10 20-10M152 290v24" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <text x="110" y="420" fill="#F1F5F9" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="700">SwiftShip</text>
  <text x="110" y="480" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="500">Package Delivery Platform</text>
  <text x="110" y="540" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="26">Microservices · live tracking · smart dispatch</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="110" y="585" width="120" height="44" rx="22" fill="#512BD4" fill-opacity="0.35" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <text x="170" y="614" text-anchor="middle" fill="#E9D5FF">.NET 8</text>
    <rect x="244" y="585" width="130" height="44" rx="22" fill="#DD0031" fill-opacity="0.2" stroke="#F43F5E" stroke-opacity="0.6"/>
    <text x="309" y="614" text-anchor="middle" fill="#FECDD3">Angular</text>
    <rect x="388" y="585" width="150" height="44" rx="22" fill="#FF6600" fill-opacity="0.2" stroke="#FB923C" stroke-opacity="0.6"/>
    <text x="463" y="614" text-anchor="middle" fill="#FED7AA">RabbitMQ</text>
    <rect x="552" y="585" width="116" height="44" rx="22" fill="#1E293B" stroke="#64748B"/>
    <text x="610" y="614" text-anchor="middle" fill="#E2E8F0">gRPC</text>
  </g>

  <!-- Right: tracking window mockup -->
  <g transform="translate(830 180)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="680" height="540" rx="22" fill="#F8FAFC"/>
    <!-- Map -->
    <clipPath id="mapClip"><rect x="24" y="24" width="400" height="492" rx="14"/></clipPath>
    <g clip-path="url(#mapClip)">
      <rect x="24" y="24" width="400" height="492" fill="#E0F2FE"/>
      <rect x="24" y="24" width="400" height="492" fill="url(#grid)"/>
      <path d="M24 170c90 20 150-40 240-10s120 60 160 40" stroke="#FFFFFF" stroke-width="18"/>
      <path d="M150 24c10 120-30 220 20 320s-10 130-20 172" stroke="#FFFFFF" stroke-width="14"/>
      <rect x="250" y="260" width="120" height="90" rx="8" fill="#BBF7D0" fill-opacity="0.8"/>
      <path d="M90 440C140 380 150 330 200 300S300 220 340 120" stroke="#F97316" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
      <circle cx="90" cy="440" r="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>
      <circle cx="200" cy="300" r="20" fill="#F97316" fill-opacity="0.25"/>
      <circle cx="200" cy="300" r="10" fill="#F97316"/>
      <path d="M340 90c-17 0-30 13-30 29 0 22 30 49 30 49s30-27 30-49c0-16-13-29-30-29z" fill="#0F172A"/>
      <circle cx="340" cy="119" r="10" fill="#FFFFFF"/>
    </g>

    <!-- Timeline panel -->
    <rect x="444" y="24" width="212" height="492" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="462" y="58" fill="#64748B" font-size="13" font-weight="600">TRACKING #</text>
    <text x="462" y="82" fill="#0F172A" font-size="16" font-weight="700">TRK-20260922</text>
    <rect x="462" y="98" width="98" height="24" rx="12" fill="#FFEDD5"/>
    <text x="511" y="115" text-anchor="middle" fill="#C2410C" font-size="13" font-weight="700">In Transit</text>

    <path d="M474 160v250" stroke="#E2E8F0" stroke-width="3"/>
    <path d="M474 160v168" stroke="#F97316" stroke-width="3"/>
    <g>
      <circle cx="474" cy="160" r="9" fill="#F97316"/>
      <rect x="494" y="152" width="100" height="9" rx="4.5" fill="#1E293B"/>
      <rect x="494" y="168" width="70" height="7" rx="3.5" fill="#CBD5E1"/>
      <circle cx="474" cy="244" r="9" fill="#F97316"/>
      <rect x="494" y="236" width="86" height="9" rx="4.5" fill="#1E293B"/>
      <rect x="494" y="252" width="80" height="7" rx="3.5" fill="#CBD5E1"/>
      <circle cx="474" cy="328" r="12" fill="#FFFFFF" stroke="#F97316" stroke-width="5"/>
      <rect x="494" y="320" width="110" height="9" rx="4.5" fill="#1E293B"/>
      <rect x="494" y="336" width="64" height="7" rx="3.5" fill="#CBD5E1"/>
      <circle cx="474" cy="410" r="9" fill="#E2E8F0"/>
      <rect x="494" y="402" width="80" height="9" rx="4.5" fill="#94A3B8"/>
    </g>
    <rect x="462" y="452" width="176" height="44" rx="10" fill="url(#orange)"/>
    <text x="550" y="480" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Auto-assign nearest</text>
  </g>
